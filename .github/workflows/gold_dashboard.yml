name: Gold Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'   # weekly, Monday 08:00 UTC

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy pandas matplotlib

      - name: Generate gold dashboard
        run: python research/gold_dashboard.py

      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/gold_dashboard.png
          git diff --cached --quiet || git commit -m "[chart] gold dashboard $(date -u +%Y-%m-%d)"
          git push
